#cloud-config
# Cloud-init configuration for GitHub Actions Runner jumphost VM
# This runs on first boot and handles all provisioning

package_update: true
package_upgrade: false

# Install base packages via apt
packages:
  - unzip
  - postgresql-client
  - dotnet-sdk-10.0
  - nodejs
  - npm
  - curl
  - wget
  - jq

# Create github-runner group
groups:
  - github-runner

# Configure the users
users:
  - name: ${admin_username}
    ssh_authorized_keys:
      - ${ssh_public_key}
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    shell: /bin/bash

  - name: github-runner
    gecos: GitHub Actions Runner
    primary_group: github-runner
    groups: docker
    shell: /bin/bash
    home: /home/github-runner
    sudo: ['ALL=(ALL) NOPASSWD:ALL']

# Write files needed for setup
write_files:
  # GitHub Runner systemd service
  - path: /etc/systemd/system/github-runner.service
    content: |
      [Unit]
      Description=GitHub Actions Runner
      After=network.target
      Wants=network-online.target

      [Service]
      Type=exec
      ExecStart=/home/github-runner/actions-runner/runsvc.sh
      WorkingDirectory=/home/github-runner/actions-runner
      User=github-runner
      KillMode=process
      KillSignal=SIGTERM
      TimeoutStopSec=5min
      Restart=on-failure
      RestartSec=30

      [Install]
      WantedBy=multi-user.target

  # Runner configuration script (fetches token from Key Vault)
  - path: /opt/configure-runner.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      RUNNER_VERSION="2.323.0"
      RUNNER_USER="github-runner"
      RUNNER_HOME="/home/github-runner"
      
      # Terraform will ignore double $$ and render single $ in the final cloud-init script, allowing us to use variables in the script that are evaluated at runtime on the VM
      RUNNER_DIR="$${RUNNER_HOME}/actions-runner"
      
      # Terraform variables, keep single $
      RUNNER_LABEL="${runner_label}"
      GITHUB_REPO_URL="${github_repo_url}"
      KEY_VAULT_NAME="${key_vault_name}"

      echo "[$(date)] Starting GitHub Runner configuration..."

      # Wait for network to be ready
      until curl -s https://api.github.com > /dev/null 2>&1; do
        echo "Waiting for network..."
        sleep 5
      done

      # Authenticate to Azure via the VM Managed Identity
      echo "[$(date)] Logging into Azure via Managed Identity..."
      az login --identity > /dev/null 2>&1

      # Fetch runner token from Key Vault using Managed Identity
      echo "[$(date)] Fetching runner token from Key Vault..."
      RUNNER_TOKEN=$(az keyvault secret show \
        --name "gh-runner-token" \
        --vault-name "$${KEY_VAULT_NAME}" \
        --query value \
        -o tsv 2>/dev/null || echo "")

      if [ -z "$${RUNNER_TOKEN}" ]; then
        echo "[$(date)] ERROR: Failed to fetch runner token from Key Vault"
        exit 1
      fi

      echo "[$(date)] Token fetched successfully"

      # Create runner directory
      mkdir -p "$${RUNNER_DIR}"
      chown "$${RUNNER_USER}:$${RUNNER_USER}" "$${RUNNER_DIR}"

      # Download runner if not already present
      RUNNER_TARBALL="$${RUNNER_HOME}/actions-runner-linux-x64-$${RUNNER_VERSION}.tar.gz"
      if [ ! -f "$${RUNNER_TARBALL}" ]; then
        echo "[$(date)] Downloading GitHub Runner v$${RUNNER_VERSION}..."
        curl -sL -o "$${RUNNER_TARBALL}" \
          "https://github.com/actions/runner/releases/download/v$${RUNNER_VERSION}/actions-runner-linux-x64-$${RUNNER_VERSION}.tar.gz"
        chown "$${RUNNER_USER}:$${RUNNER_USER}" "$${RUNNER_TARBALL}"
      fi

      # Extract runner if not already extracted
      if [ ! -f "$${RUNNER_DIR}/.runner" ]; then
        echo "[$(date)] Extracting runner..."
        tar xzf "$${RUNNER_TARBALL}" -C "$${RUNNER_DIR}"
        chown -R "$${RUNNER_USER}:$${RUNNER_USER}" "$${RUNNER_DIR}"
      fi

      # Configure runner if not already configured
      if [ ! -f "$${RUNNER_DIR}/.runner" ]; then
        echo "[$(date)] Configuring runner..."
        su - "$${RUNNER_USER}" -c "cd $${RUNNER_DIR} && ./config.sh \
          --url $${GITHUB_REPO_URL} \
          --token $${RUNNER_TOKEN} \
          --name $${RUNNER_LABEL} \
          --labels $${RUNNER_LABEL} \
          --unattended \
          --replace"
      else
        echo "[$(date)] Runner already configured"
      fi

      echo "[$(date)] Configuration complete"

  # Setup script for all tooling
  - path: /opt/setup-tools.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -e

      TERRAFORM_VERSION="1.14.6"

      echo "[$(date)] Starting tool installation..."

      # Azure CLI
      if ! command -v az &> /dev/null; then
        echo "[$(date)] Installing Azure CLI..."
        curl -sL https://aka.ms/InstallAzureCLIDeb | bash
      else
        echo "[$(date)] Azure CLI already installed"
      fi

      # Docker
      if ! command -v docker &> /dev/null; then
        echo "[$(date)] Installing Docker..."
        curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
        sh /tmp/get-docker.sh
        
        # Terraform variable, keep single $
        usermod -aG docker ${admin_username}
      else
        echo "[$(date)] Docker already installed"
      fi

      # kubectl
      if ! command -v kubectl &> /dev/null; then
        echo "[$(date)] Installing kubectl..."
        az aks install-cli
      else
        echo "[$(date)] kubectl already installed"
      fi

      # Helm
      if ! command -v helm &> /dev/null; then
        echo "[$(date)] Installing Helm..."
        curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      else
        echo "[$(date)] Helm already installed"
      fi

      # k9s
      if ! command -v k9s &> /dev/null; then
        echo "[$(date)] Installing k9s..."
        curl -sL https://github.com/derailed/k9s/releases/latest/download/k9s_Linux_amd64.tar.gz | tar xz -C /usr/local/bin k9s
      else
        echo "[$(date)] k9s already installed"
      fi

      # Terraform
      if ! command -v terraform &> /dev/null; then
        echo "[$(date)] Installing Terraform v$${TERRAFORM_VERSION}..."
        wget -q -O /tmp/terraform.zip \
          "https://releases.hashicorp.com/terraform/$${TERRAFORM_VERSION}/terraform_$${TERRAFORM_VERSION}_linux_amd64.zip"
        unzip -o /tmp/terraform.zip -d /usr/local/bin/
        rm /tmp/terraform.zip
      else
        echo "[$(date)] Terraform already installed"
      fi

      echo "[$(date)] Tool installation complete"

# Run commands in order on first boot
runcmd:
  # 1. Run tool installation script first
  - bash /opt/setup-tools.sh > /var/log/setup-tools.log 2>&1

  # 2. Enable and start Docker service
  - systemctl enable docker
  - systemctl start docker

  # 3. Run runner configuration script
  - bash /opt/configure-runner.sh > /var/log/configure-runner.log 2>&1

  # 4. Reload systemd and enable runner service
  - systemctl daemon-reload
  - systemctl enable github-runner.service
  - systemctl start github-runner.service

  # Final status
  - echo "Cloud-init completed at $(date)" >> /var/log/cloud-init-complete.log